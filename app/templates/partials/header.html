{#
  @template partials/header.html
  @description 前台頁首：Logo、主要導覽、登入 / 登出。登出使用 POST 表單（避免被連結誤觸發）。
#}
<header class="app-header">
  <nav class="app-header__nav container" aria-label="主選單">
    <a href="/" class="app-header__logo">{{ SITE_NAME }}</a>
    <a href="/invoices">我的發票</a>
    <a href="/invoices/upload">上傳發票</a>
    {% if request.cookies.get(SESSION_COOKIE_NAME) %}
      <form method="post" action="/logout" data-confirm="確定要登出嗎？">
        <button type="submit" class="btn btn--text">登出</button>
      </form>
    {% else %}
      <a href="/login">登入</a>
    {% endif %}
  </nav>
</header>
